# KataGo JSON analysis configuration for 弈境围棋.
#
# Tuned locally for one RTX 5070 Ti (16 GB) using the CUDA 13.2 backend.
# Individual professional tiers override maxVisits in each JSON request.

logToStderr = false
logErrorsAndWarnings = true

# The Python adapter expects winrate and scoreLead from Black's perspective.
reportAnalysisWinratesAs = BLACK
maxVisits = 120

# A local benchmark of the installed b10c384 transformer model favored 32
# search threads, two neural-network servers, and batches of 16.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 32
numNNServerThreadsPerModel = 2
nnMaxBatchSize = 16
cudaUseFP16 = true
cudaUseNHWC = true

# About 0.5M cached evaluations, avoiding the multi-gigabyte defaults of some
# server-oriented sample configurations.
nnCacheSizePowerOfTwo = 19
nnMutexPoolSizePowerOfTwo = 15
nnRandomize = true
