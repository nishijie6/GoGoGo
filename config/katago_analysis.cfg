# KataGo JSON analysis configuration for 弈境围棋.
#
# This conservative single-position setup works with OpenCL, CUDA, TensorRT,
# Eigen, and other official KataGo backends. Individual professional tiers
# override maxVisits in each JSON request.

logToStderr = false
logErrorsAndWarnings = true

# The Python adapter expects winrate and scoreLead from Black's perspective.
reportAnalysisWinratesAs = BLACK
maxVisits = 120

# The GUI sends only one position at a time. Four search threads are a modest
# default for both GPU and CPU builds and can be tuned by advanced users.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4
nnMaxBatchSize = 8

# About 0.5M cached evaluations, avoiding the multi-gigabyte defaults of some
# server-oriented sample configurations.
nnCacheSizePowerOfTwo = 19
nnMutexPoolSizePowerOfTwo = 15
nnRandomize = true
